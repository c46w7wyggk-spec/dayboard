<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day Board</title>
<style>
:root{--fg:#f4f6fb;--dim:rgba(244,246,251,.66);--faint:rgba(244,246,251,.38);--card:rgba(8,12,26,.34);--line:rgba(255,255,255,.13);--accent:#ffd27a;--rain:#8fc7ff;--good:#9be3b0}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(100vw / 120)}
html,body{height:100%;overflow:hidden;background:#0b1020;color:var(--fg);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;cursor:none}
.abs{position:absolute;top:0;left:0;right:0;bottom:0}
#sky{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden}
.skyl{position:absolute;top:0;left:0;right:0;bottom:0;transition:opacity 6s linear}
.blob{position:absolute;border-radius:50%;will-change:transform}
.b1{width:70vw;height:70vw;left:-15vw;top:-30vw;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 62%);animation:d1 140s ease-in-out infinite alternate}
.b2{width:60vw;height:60vw;right:-20vw;bottom:-35vw;background:radial-gradient(circle,rgba(255,220,180,.14),rgba(255,220,180,0) 62%);animation:d2 170s ease-in-out infinite alternate}
.b3{width:45vw;height:45vw;left:35vw;top:20vh;background:radial-gradient(circle,rgba(160,200,255,.10),rgba(160,200,255,0) 62%);animation:d3 120s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(30vw,18vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-35vw,-22vh) scale(.9)}}
@keyframes d3{to{transform:translate(-25vw,25vh) scale(1.2)}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
.drop{position:absolute;top:-12vh;width:1px;height:9vh;background:linear-gradient(rgba(190,220,255,0),rgba(190,220,255,.45));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(125vh)}}
#stars,#rain,#snow,#overcast,#fog,#hglow,#moon,#sun{transition:opacity 4s}
#sun,#moon{position:absolute;width:0;height:0;transition:opacity 4s,left 50s linear,top 50s linear}
#sun .glow{position:absolute;left:-22vw;top:-22vw;width:44vw;height:44vw;border-radius:50%;background:radial-gradient(circle,var(--sg1,rgba(255,240,205,.5)) 0%,var(--sg2,rgba(255,220,160,.16)) 22%,rgba(255,210,150,0) 60%)}
#sun .disc{position:absolute;left:-2.4vw;top:-2.4vw;width:4.8vw;height:4.8vw;border-radius:50%;background:radial-gradient(circle,#fffdf2 0%,#fff6d6 55%,var(--sd,#ffe7a8) 100%);box-shadow:0 0 2.5vw var(--sg1,rgba(255,240,205,.7))}
#moon .glow{position:absolute;left:-12vw;top:-12vw;width:24vw;height:24vw;border-radius:50%;background:radial-gradient(circle,rgba(220,230,255,.22) 0%,rgba(200,215,255,.06) 30%,rgba(200,215,255,0) 62%)}
#moon .disc{position:absolute;left:-2.3vw;top:-2.3vw;width:4.6vw;height:4.6vw}
#moon .disc svg{width:100%;height:100%;display:block}
#hglow{background:radial-gradient(ellipse 60vw 38vh at var(--hx,50%) 100%,var(--hc,rgba(255,140,80,.5)),rgba(255,140,80,0) 100%)}
#overcast{background:linear-gradient(180deg,var(--oc,rgba(120,130,145,.7)) 0%,var(--oc2,rgba(120,130,145,.25)) 65%,rgba(120,130,145,0) 100%)}
#left{text-shadow:0 1px .8rem rgba(0,10,30,.28)}
.cloud{position:absolute;left:0;width:34rem;height:13rem;opacity:0;transition:opacity 8s;animation:drift linear infinite;will-change:transform}
@keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(125vw)}}
#fog i{position:absolute;left:-50%;width:200%;height:45%;background:radial-gradient(ellipse 50% 50% at 50% 50%,var(--fg2,rgba(200,208,220,.35)),rgba(200,208,220,0) 70%);animation:fogd 90s ease-in-out infinite alternate}
#fog i:first-child{top:30%}#fog i:last-child{top:58%;animation-duration:130s;animation-direction:alternate-reverse}
@keyframes fogd{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
#flash{background:rgba(220,230,255,.55);animation:flash 11s linear infinite;animation-play-state:paused}
@keyframes flash{0%,61%,63.5%,66%,100%{opacity:0}62%{opacity:.9}64.5%{opacity:.6}}
#flash.on{animation-play-state:running}
#garland,#xhills{display:none}
body.t-christmas #garland{display:block;position:absolute;top:0;left:0;width:100%}
body.t-christmas #xhills{display:block}
#garland svg,#xhills svg{display:block;width:100%}
#xhills svg{position:absolute;bottom:0;left:0;height:22vh}
.bulb{animation:twk 3s ease-in-out infinite alternate}
@keyframes twk{0%{opacity:1}70%{opacity:.85}100%{opacity:.35}}
body.t-christmas #app{padding-top:4.6rem}
body.t-christmas .b1{background:radial-gradient(circle,rgba(255,70,70,.16),rgba(255,70,70,0) 62%)}
body.t-christmas .b2{background:radial-gradient(circle,rgba(70,220,120,.13),rgba(70,220,120,0) 62%)}
body.t-christmas .b3{background:radial-gradient(circle,rgba(255,205,90,.13),rgba(255,205,90,0) 62%)}
body.t-christmas .next,body.t-christmas #stage{border-color:rgba(255,210,122,.28)}
#xmas{display:none}
body.t-christmas #xmas{display:inline-flex;background:rgba(220,40,50,.2);border-color:rgba(255,120,120,.4)}
.flake{position:absolute;top:-4vh;border-radius:50%;background:#fff;opacity:.8;animation:snowfall linear infinite}
@keyframes snowfall{to{transform:translate(4vw,112vh)}}
body.t-light{--fg:#14203a;--dim:rgba(20,32,58,.72);--faint:rgba(20,32,58,.5);--card:rgba(255,255,255,.55);--line:rgba(20,32,58,.16);--accent:#b35a00;--rain:#1f6fc0;--good:#1c7a3c}
body.t-light svg [stroke^="rgba(255"]{stroke:rgba(20,32,58,.3)}
body.t-light svg [fill^="rgba(255"]{fill:rgba(20,32,58,.1)}
body.t-light svg [stroke="#fff"]{stroke:#14203a}
body.t-light svg [fill="#fff"]{fill:#14203a}
body.t-light svg text[fill^="rgba(255"],body.t-light svg text[fill^="rgba(244"]{fill:rgba(20,32,58,.72)}
body.t-light svg [stroke="#ffd27a"],body.t-light svg [stroke="url(#ts)"]{stroke:#d9822b}
body.t-light svg [fill="#ffd27a"]{fill:#e8953a}
body.t-light svg [stroke="#0b1020"]{stroke:#e9f1fb}
body.t-light .blob{opacity:.25}
body.t-light svg text[fill="#8fc7ff"],body.t-light svg text[fill="#a9d4ff"]{fill:#1f6fc0}
body.t-christmas{--accent:#ffd36b;--good:#8ff0a8;--card:rgba(6,14,30,.42)}

#app{position:absolute;top:0;left:0;right:0;bottom:0;padding:3rem 3.5rem 0;display:grid;grid-template-columns:35rem 1fr;grid-template-rows:1fr 5rem;grid-column-gap:3rem;grid-row-gap:2rem;transition:transform 3s ease-in-out}
#left{display:flex;flex-direction:column;min-height:0}
.time{font-size:9.5rem;font-weight:200;letter-spacing:-.04em;line-height:.95;display:flex;align-items:flex-start}
.time .sec{font-size:2.6rem;font-weight:300;color:var(--dim);margin:1.1rem 0 0 .8rem;width:4.2rem;font-variant-numeric:tabular-nums}
.time .ampm{font-size:2rem;font-weight:400;color:var(--dim);margin:4.6rem 0 0 -4.2rem}
.date{font-size:2rem;font-weight:400;color:var(--dim);margin-top:.9rem}
.wx{margin-top:2.6rem;display:flex;align-items:center}
.wx .ic{font-size:5.6rem;line-height:1;margin-right:1.4rem}
.wx .t{font-size:5.4rem;font-weight:300;line-height:1}
.wx .c{font-size:1.7rem;margin-top:.3rem}
.wx .s{font-size:1.35rem;color:var(--dim);margin-top:.35rem}
.chip{margin-top:1.6rem;display:inline-flex;align-items:center;padding:.8rem 1.2rem;border-radius:1rem;background:rgba(120,180,255,.16);border:1px solid rgba(143,199,255,.35);font-size:1.4rem;line-height:1.3}
.chip.ok{background:rgba(155,227,176,.12);border-color:rgba(155,227,176,.3)}
.chip b{margin-right:.6rem;font-size:1.6rem}
.next{margin-top:auto;margin-bottom:.5rem;background:var(--card);border:1px solid var(--line);border-radius:1.6rem;padding:1.8rem 2rem;position:relative;overflow:hidden}
.eyebrow{font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:500}
.next .nm{font-size:2.3rem;font-weight:500;margin-top:.6rem;line-height:1.15}
.next .sub{font-size:1.35rem;color:var(--dim);margin-top:.4rem}
.next .cd{font-size:3.4rem;font-weight:300;margin-top:1rem;color:var(--accent);font-variant-numeric:tabular-nums}
.next .bar{position:absolute;left:0;bottom:0;height:.35rem;background:var(--accent);opacity:.8;transition:width 1s linear}

#stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:2rem;overflow:hidden;min-height:0}
.stagehead{position:absolute;top:0;left:0;right:0;padding:2rem 2.6rem 0;display:flex;align-items:center;justify-content:space-between;z-index:2}
.stagehead .ttl{font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:500}
.dots{display:flex}
.dots i{width:.7rem;height:.7rem;border-radius:50%;background:var(--faint);margin-left:.7rem;transition:all .6s}
.dots i.on{background:var(--fg);width:2rem;border-radius:.35rem}
.prog{position:absolute;left:0;bottom:0;height:.3rem;background:rgba(255,255,255,.55);z-index:2}
.panel{position:absolute;top:0;left:0;right:0;bottom:0;padding:5.5rem 2.6rem 2.4rem;opacity:0;transform:translateY(2rem);transition:opacity 1.1s ease,transform 1.1s ease;display:flex;flex-direction:column}
.panel.on{opacity:1;transform:none}
.ph{font-size:3rem;font-weight:400;line-height:1.2}
.pp{font-size:1.6rem;color:var(--dim);margin-top:.6rem;line-height:1.4}

/* charts */
.chart{flex:1;min-height:0;margin-top:1.6rem;position:relative}
.chart svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
.sunstats{display:flex;justify-content:space-between;align-items:flex-end;margin-top:1.4rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.stat .v{font-size:2.5rem;font-weight:300;font-variant-numeric:tabular-nums}
.stat .v small{font-size:1.2rem;color:var(--dim);margin-left:.5rem}
.stat .k{font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-top:.3rem}
.stat.moon{display:flex;align-items:center}
.stat.moon svg{width:4.4rem;height:4.4rem;margin-right:1.2rem}

/* learn */
.learn{display:flex;flex:1;min-height:0;margin-top:1.2rem}
.learn .main{flex:1.35;padding-right:2.8rem;display:flex;flex-direction:column;min-height:0}
.learn .k{font-size:1.15rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500}
.learn .h{font-size:3.4rem;margin-top:.7rem;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lbody{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:1.6rem}
.limg{height:46%;flex:none;margin-bottom:1.6rem;border-radius:1.4rem;overflow:hidden;background:rgba(255,255,255,.06)}
.limg img{width:100%;height:100%;object-fit:cover;display:block}
.learn .x{flex:1;min-height:0;overflow:hidden;font-size:1.75rem;line-height:1.55;color:rgba(244,246,251,.82)}
.learn .side{flex:1;border-left:1px solid var(--line);padding-left:2.8rem;display:flex;flex-direction:column;min-height:0}
.learn .side .sk{font-size:1.15rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:500}
.tl{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;margin-top:1.4rem;position:relative;padding-left:2.4rem}
.tl:before{content:"";position:absolute;left:.45rem;top:1rem;bottom:1rem;width:2px;background:linear-gradient(var(--accent),rgba(255,210,122,.1))}
.otd{position:relative}
.otd:before{content:"";position:absolute;left:-2.4rem;top:.75rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#0b1020;border:2px solid var(--accent)}
.otd .y{font-size:1.9rem;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.otd .tx{font-size:1.4rem;line-height:1.4;color:var(--dim);margin-top:.2rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* to-do */
.tdhead{display:flex;align-items:baseline;justify-content:space-between}
.tdcount{font-size:1.5rem;color:var(--dim)}
.tdlist{flex:1;min-height:0;overflow:hidden;margin-top:1.6rem;display:flex;flex-direction:column}
.tdsec{font-size:1.1rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:1rem 0 .6rem}
.tdsec:first-child{margin-top:0}
.tdsec.over{color:#ff9d8a}
.td{display:flex;align-items:center;padding:.85rem 1.2rem;border-radius:1.1rem;margin-bottom:.45rem;background:rgba(255,255,255,.05);border:2px solid transparent;outline:none;position:relative;flex:none;transition:background .3s,border-color .2s,opacity .4s}
.td .bx{width:2.2rem;height:2.2rem;border-radius:.65rem;border:2px solid var(--faint);margin-right:1.4rem;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#0b1020}
.td .tt{font-size:1.85rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .ls{font-size:1.2rem;color:var(--faint);margin-left:1rem;flex:none}
.td .due{font-size:1.25rem;color:var(--dim);margin-left:1.2rem;padding:.25rem .8rem;border-radius:.6rem;background:rgba(255,255,255,.07);flex:none;font-variant-numeric:tabular-nums}
.td .due.over{color:#ffb3a5;background:rgba(255,120,100,.16)}
.td .due.today{color:var(--accent);background:rgba(255,210,122,.14)}
.td.hi:before{content:"";position:absolute;left:0;top:.8rem;bottom:.8rem;width:.35rem;border-radius:.2rem;background:var(--accent)}
.td.done{opacity:.45}
.td.done .tt{text-decoration:line-through}
.td.done .bx{background:var(--good);border-color:var(--good)}
.td:focus{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.1)}
.tdmore{font-size:1.3rem;color:var(--faint);margin-top:.4rem}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--dim)}
.empty .big{font-size:5rem;margin-bottom:1rem}
.empty .t1{font-size:2.2rem;color:var(--fg)}
.empty .t2{font-size:1.5rem;margin-top:.6rem;max-width:52rem;line-height:1.45}
.hint{font-size:1.15rem;color:var(--faint);margin-top:1rem}

/* week */
.week{flex:1;display:flex;margin-top:2rem;min-height:0}
.day{flex:1;margin-right:1.2rem;display:flex;flex-direction:column;min-height:0}
.day:last-child{margin-right:0}
.day .dh{font-size:1.5rem;color:var(--dim);padding-bottom:.8rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.day.today .dh{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.cls{background:rgba(255,255,255,.07);border-radius:1rem;padding:.9rem 1.1rem;margin-bottom:.8rem}
.cls .c1{font-size:1.45rem;font-weight:500}
.cls .c2{font-size:1.2rem;color:var(--dim);margin-top:.2rem}
.cls.past{opacity:.4}
.free{font-size:1.4rem;color:var(--faint);padding:.6rem 0}

#ticker{grid-column:1 / -1;position:relative;overflow:hidden;border-top:1px solid var(--line);display:flex;align-items:center}
#ticker .lab{position:relative;z-index:2;flex:none;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;padding-right:2rem;margin-right:0;background:inherit}
.tkwin{flex:1;overflow:hidden;position:relative;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.track span{font-size:1.55rem;color:var(--dim);padding-right:4rem}
.track span b{color:var(--fg);font-weight:500}
.track span:before{content:"•";color:var(--faint);margin-right:4rem}
#sample{position:fixed;top:1rem;right:1.2rem;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;color:#0b1020;background:var(--accent);padding:.35rem .8rem;border-radius:.5rem;display:none;z-index:9}
</style>
</head>
<body>
<div id="sky">
  <div class="skyl" id="skyA"></div><div class="skyl" id="skyB" style="opacity:0"></div>
  <div id="stars" class="abs" style="opacity:0"></div>
  <div id="hglow" class="abs" style="opacity:0"></div>
  <div id="moon" style="opacity:0"><div class="glow"></div><div class="disc" id="moondisc"></div></div>
  <div id="sun" style="opacity:0"><div class="glow"></div><div class="disc"></div></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div id="overcast" class="abs" style="opacity:0"></div>
  <div id="clouds" class="abs"></div>
  <div id="fog" class="abs" style="opacity:0"><i></i><i></i></div>
  <div id="rain" class="abs" style="opacity:0"></div>
  <div id="snow" class="abs" style="opacity:0"></div>
  <div id="flash" class="abs" style="opacity:0"></div>
  <div id="xhills" class="abs"></div>
  <div id="garland"></div>
</div>
<div id="sample">Sample weather · live data loads on the TV</div>
<div id="app">
  <section id="left">
    <div class="time"><span id="hm">--:--</span></div>
    <div class="date" id="date"></div>
    <div class="wx">
      <div class="ic" id="wxic">·</div>
      <div><div class="t" id="wxt">--°</div></div>
      <div style="margin-left:1.6rem"><div class="c" id="wxc">Loading weather…</div><div class="s" id="wxs"></div></div>
    </div>
    <div><div class="chip" id="chip" style="display:none"></div></div>
    <div><div class="chip" id="xmas"></div></div>
    <div class="next" id="next">
      <div class="eyebrow" id="nxlab">Up next</div>
      <div class="nm" id="nxnm">—</div>
      <div class="sub" id="nxsub"></div>
      <div class="cd" id="nxcd"></div>
      <div class="bar" id="nxbar" style="width:0"></div>
    </div>
  </section>
  <section id="stage">
    <div class="stagehead"><div class="ttl" id="pttl"></div><div class="dots" id="dots"></div></div>
    <div id="panels"></div>
    <div class="prog" id="prog" style="width:0"></div>
  </section>
  <section id="ticker"><div class="lab">Politics</div><div class="tkwin"><div class="track" id="track"></div></div></section>
</div>

  var now=new Date(), it=null, cur=null, prevEnd=null;
  for(var off=0; off<70 && !it; off++){
    var d=new Date(now); d.setDate(d.getDate()+off); d.setHours(0,0,0,0);

      if(x.start>now){ it=x; it.off=off; break; }
      if(x.end<=now) prevEnd=x.end;
    }
  }

    $("nxlab").textContent="Happening now"; $("nxnm").textContent=title(cur);

  var ms=it.start-now; $("nxcd").textContent= ms<60000 ? "now" : (it.off>=2 ? "in "+it.off+" days" : "in "+dur(ms));
  var from = prevEnd && it.off===0 ? prevEnd : new Date(it.start.getTime()-3*3600000);

}

  var el=$("p_week"); if(!el) return;
  var now=new Date(), mon=new Date(now); mon.setHours(0,0,0,0); var dw=mon.getDay(); mon.setDate(mon.getDate()-((dw+6)%7));
  if(dw===6||dw===0) mon.setDate(mon.getDate()+7);
  var h="", any=false;
  for(var i=0;i<5;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); var raw=itemsOn(d), cl=[], grp={};
    raw.forEach(function(x){ if(!x.group){ cl.push(x); return; } var g=grp[x.group]; if(!g){ g=grp[x.group]={kind:"group",name:x.group,start:x.start,end:x.end,room:x.room,n:0}; cl.push(g); } g.n++; if(x.end>g.end) g.end=x.end; });
    if(cl.length) any=true;
    h+='<div class="day'+(ymd(d)===ymd(now)?' today':'')+'"><div class="dh">'+DAYS[d.getDay()].slice(0,3)+' '+(d.getMonth()+1)+'/'+d.getDate()+'</div>';
    if(!cl.length) h+='<div class="free">Free</div>';
    cl.forEach(function(c){
      var top=fmtT(c.start)+(c.kind==="class"?' · '+c.code:'');
      var nm = c.kind==="class" ? c.name : (c.kind==="group" ? c.name+' · '+c.n+' sessions till '+fmtT(c.end) : c.name);
      h+='<div class="cls'+(c.end<now?' past':'')+'"><div class="c1">'+esc(top)+'</div><div class="c2">'+esc(nm)+(c.room&&c.kind!=="group"?' · '+esc(c.room):'')+'</div></div>'; });
    h+='</div>'; }
  var lbl = (dw===6||dw===0) ? "Next week" : "This week", sub;
  if(any) sub = inTerm(now)||inTerm(mon) ? CFG.term.name : "Finals & events";
  else if(CFG.term.classes.length && ymd(now)<CFG.term.start){ var st=new Date(CFG.term.start+"T00:00:00"); sub="Break — "+CFG.term.name.toLowerCase()+" starts "+DAYS[st.getDay()].slice(0,3)+", "+MON[st.getMonth()].slice(0,3)+" "+st.getDate()+" ("+Math.round((st-new Date(ymd(now)+"T00:00:00"))/86400000)+" days)"; }
  else sub="Nothing on the calendar this week.";
  el.innerHTML='<div class="ph">'+lbl+'</div><div class="pp">'+esc(sub)+'</div><div class="week">'+h+'</div>';
}

/* ---------- learn + news (Wikipedia, free, no key) ---------- */
function loadWiki(){
  var d=new Date(), u="https://en.wikipedia.org/api/rest_v1/feed/featured/"+d.getFullYear()+"/"+pad(d.getMonth()+1)+"/"+pad(d.getDate());
  return fetch(u,{headers:{"Accept":"application/json"}}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ WIKI=j; buildLearn(); })
    .catch(function(){ if(!WIKI){ buildLearn(); } });
}
var learnI=0;
function learnCards(){
  var out=[];
  if(WIKI&&WIKI.tfa) out.push({k:"Featured article",h:WIKI.tfa.normalizedtitle||WIKI.tfa.title,x:WIKI.tfa.extract,img:pickImg(WIKI.tfa)});
  if(WIKI&&WIKI.onthisday) WIKI.onthisday.slice(0,6).forEach(function(e){ if(e.pages&&e.pages[0]&&e.pages[0].extract) out.push({k:"On this day · "+e.year,h:e.pages[0].normalizedtitle||e.pages[0].title,x:e.pages[0].extract,img:pickImg(e.pages[0])}); });
  if(WIKI&&WIKI.mostread&&WIKI.mostread.articles) WIKI.mostread.articles.slice(0,4).forEach(function(a){ if(a.extract) out.push({k:"Trending on Wikipedia",h:a.normalizedtitle||a.title,x:a.extract,img:pickImg(a)}); });
  if(!out.length) out=[{k:"Learn",h:"The Library of Alexandria",x:"Founded in the 3rd century BC under the Ptolemies, the Library of Alexandria aimed to collect a copy of every book in the known world. Ships docking in the harbor reportedly had their scrolls copied — the library kept the originals and returned the copies. Its decline was gradual, over centuries of budget cuts, purges of scholars and war, rather than a single great fire."}];
  return out;
}
function buildLearn(){ rotateLearn(true); }
function fitText(el,text){
  el.textContent=text; if(el.scrollHeight<=el.clientHeight+1) return;
  var lo=0, hi=text.length;
  while(lo<hi){ var mid=(lo+hi+1)>>1; el.textContent=text.slice(0,mid).replace(/\s+\S*$/,"")+"…"; if(el.scrollHeight<=el.clientHeight+1) lo=mid; else hi=mid-1; }
  el.textContent=text.slice(0,lo).replace(/\s+\S*$/,"")+"…";
}
function pickImg(pg){ if(!pg) return null; if(pg.originalimage&&pg.originalimage.width<=2000) return pg.originalimage.source; return pg.thumbnail?pg.thumbnail.source:null; }
function rotateLearn(keep){
  var el=$("p_learn"); if(!el) return; var cs=learnCards(); if(!keep) learnI++; var c=cs[learnI%cs.length];
  var side="";
  if(WIKI&&WIKI.onthisday){ WIKI.onthisday.slice(0,5).forEach(function(e){ side+='<div class="otd"><div class="y">'+e.year+'</div><div class="tx">'+esc(e.text)+'</div></div>'; }); }
  else side='<div class="otd"><div class="tx">Daily history loads from Wikipedia when the TV is online.</div></div>';
  el.innerHTML='<div class="learn"><div class="main"><div class="k">'+esc(c.k)+'</div><div class="h">'+esc(c.h)+'</div><div class="lbody">'+
    (c.img?'<div class="limg"><img src="'+esc(c.img)+'" onerror="this.parentNode.parentNode.removeChild(this.parentNode);fitText(document.getElementById(\'lx\'),window.LX||\'\')"></div>':'')+
    '<div class="x" id="lx"></div></div></div><div class="side"><div class="sk">On this day</div><div class="tl">'+side+'</div></div></div>';
  window.LX=c.x||""; fitText($("lx"),window.LX);
}
var HEAD=null;
var FEEDS=[["NPR","https://feeds.npr.org/1014/rss.xml"],["Fox News","https://moxie.foxnews.com/google-publisher/politics.xml"],["The Hill","https://thehill.com/news/feed/"]];
var HEAD_URLS=["https://raw.githubusercontent.com/c46w7wyggk-spec/dayboard/data/headlines.json","headlines.json"];
function tryUrls(i){
  if(i>=HEAD_URLS.length) return Promise.reject();
  return fetch(HEAD_URLS[i]+"?t="+Math.floor(Date.now()/60000)).then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ if(!j.items||!j.items.length) throw 0; var age=Date.now()-new Date(j.updated).getTime(); if(age>12*3600000 && i<HEAD_URLS.length-1) throw 0; return j.items; })
    .catch(function(){ return tryUrls(i+1); });
}
function viaRss2Json(){
  return Promise.all(FEEDS.map(function(f){
    return fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f[1])).then(function(r){return r.json();})
      .then(function(j){ return (j.items||[]).slice(0,8).map(function(it){ return {src:f[0],title:it.title,pub:new Date(it.pubDate.replace(" ","T")+"Z").toISOString()}; }); })
      .catch(function(){ return []; });
  })).then(function(a){ return [].concat.apply([],a); });
}
function pickHeadlines(items){
  var cut=Date.now()-36*3600000, bySrc={};
  items.forEach(function(x){ if(new Date(x.pub).getTime()>=cut){ (bySrc[x.src]=bySrc[x.src]||[]).push(x); } });
  var names=Object.keys(bySrc), out=[], i=0;
  names.forEach(function(n){ bySrc[n].sort(function(a,b){ return new Date(b.pub)-new Date(a.pub); }); });
  while(out.length<18){ var added=false; names.forEach(function(n){ if(bySrc[n][i]){ out.push(bySrc[n][i]); added=true; } }); if(!added) break; i++; }
  return out;
}
function loadHeadlines(){
  return tryUrls(0).catch(function(){ return viaRss2Json(); }).then(function(items){ var h=pickHeadlines(items); if(h.length){ HEAD=h; } buildTicker(); }).catch(function(){ buildTicker(); });
}
function buildTicker(){
  var items=(HEAD||[]).map(function(x){ return "<b>"+esc(x.src)+"</b>  "+esc(x.title); });
  if(!items.length) items=["Loading political headlines…"];
  var one=items.map(function(s){ return "<span>"+s+"</span>"; }).join("");
  var tr=$("track"); tr.innerHTML=one+one;
  setTimeout(function(){
    var w=tr.scrollWidth/2, pxps=70*(window.innerWidth/1920), secs=Math.max(30,w/pxps);
    tr.style.animation="none"; void tr.offsetWidth;
    var name="tk"+Date.now(), css=document.createElement("style");
    css.textContent="@keyframes "+name+"{from{transform:translateX(0)}to{transform:translateX(-"+w+"px)}}"; document.head.appendChild(css);
    tr.style.animation=name+" "+secs+"s linear infinite";
  },50);
}

/* ---------- Homebase feed: to-dos + calendar ---------- */
function qp(n){ var m=location.search.match(new RegExp("[?&]"+n+"=([^&]+)")); return m?decodeURIComponent(m[1]):null; }
var FEED_URL=qp("feed")||store("feedUrl"), FEED_KEY=qp("k")||store("feedKey"), FEED=null, FEED_ERR=null;
if(qp("feed")) store("feedUrl",FEED_URL); if(qp("k")) store("feedKey",FEED_KEY);
function feedUrl(){ return FEED_URL+(FEED_URL.indexOf("?")<0?"?":"&")+"key="+encodeURIComponent(FEED_KEY||""); }
function loadFeed(){
  if(!FEED_URL){ applyFeed(store("feedCache")); return; }
  fetch(feedUrl()+"&t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw r.status; return r.json(); })
    .then(function(j){ FEED_ERR=null; store("feedCache",j); applyFeed(j); })
    .catch(function(e){ FEED_ERR=e; if(!FEED) applyFeed(store("feedCache")); else buildTodo(); });
}
function applyFeed(j){
  if(j){
    FEED=j;
    if(j.settings&&j.settings.theme) setTheme(j.settings.theme);
    if(j.events) CFG.events=j.events.map(function(e){ return [e.date,e.start||"00:00",e.end||e.start||"23:59",e.title,e.location||"",e.group||""]; });
    if("term" in j){ var t=j.term;
      CFG.term = t ? {name:t.name||"Term",start:t.start,end:t.end,skip:t.skip||[],classes:(t.classes||[]).map(function(c){ return {code:c.code||"",name:c.name,days:c.days,s:c.start,e:c.end,room:c.room||"",until:c.until||null}; })}
                   : {name:"",start:"9999-12-31",end:"9999-12-31",skip:[],classes:[]}; }
    buildWeek(); drawNext();
  }
  buildTodo();
}
function dueInfo(t){
  if(!t.due_date) return {cls:"",lab:"",sec:"later",ord:9e15};
  var today=ymd(new Date()), d=new Date(t.due_date+"T"+(t.due_time||"23:59")+":00"), tm=new Date(); tm.setDate(tm.getDate()+1);
  var lab, cls="", sec;
  if(t.due_date<today){ sec="over"; cls="over"; var n=Math.round((new Date(today+"T00:00:00")-new Date(t.due_date+"T00:00:00"))/86400000); lab=n===1?"Yesterday":n+" days late"; }
  else if(t.due_date===today){ sec="today"; cls="today"; lab=t.due_time?t.due_time:"Today"; }
  else if(t.due_date===ymd(tm)){ sec="soon"; lab="Tomorrow"+(t.due_time?" "+t.due_time:""); }
  else { sec="soon"; lab=DAYS[d.getDay()].slice(0,3)+" "+(d.getMonth()+1)+"/"+d.getDate(); if((d-new Date())>7*86400000) sec="later"; }
  return {cls:cls,lab:lab,sec:sec,ord:d.getTime()};
}
function buildTodo(){
  var el=$("p_todo"); if(!el) return;
  var focusId=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute("data-id");
  if(!FEED){
    el.innerHTML='<div class="ph">To-do</div><div class="empty"><div class="big">☑︎</div><div class="t1">'+(FEED_URL?"Can’t reach Homebase right now":"Connect Homebase")+'</div><div class="t2">'+
      (FEED_URL?"Retrying every minute. Your list shows up here as soon as the feed answers.":"Your to-dos appear here once the Dayboard feed is set up in Homebase and its link is added to the TV.")+'</div></div>';
    return;
  }
  var today=ymd(new Date()), todos=(FEED.todos||[]).filter(function(t){ return !t.done || (t.done_at && ymd(new Date(t.done_at))===today); });
  var open=todos.filter(function(t){return !t.done;}), done=todos.filter(function(t){return t.done;});
  var P={high:0,normal:1,low:2};
  open.forEach(function(t){ t._d=dueInfo(t); });
  open.sort(function(a,b){ return a._d.ord-b._d.ord || (P[a.priority]||1)-(P[b.priority]||1); });
  var secs=[["over","Overdue"],["today","Today"],["soon","This week"],["later","Later"]], h="", shown=0, MAX=9;
  secs.forEach(function(sc){ var items=open.filter(function(t){ return t._d.sec===sc[0]; }); if(!items.length||shown>=MAX) return;
    h+='<div class="tdsec'+(sc[0]==="over"?" over":"")+'">'+sc[1]+'</div>';
    items.forEach(function(t){ if(shown>=MAX) return; shown++;
      h+='<div class="td'+(t.priority==="high"?" hi":"")+'" tabindex="0" data-id="'+esc(t.id)+'"><div class="bx"></div><div class="tt">'+esc(t.title)+'</div>'+(t.list?'<div class="ls">'+esc(t.list)+'</div>':'')+(t._d.lab?'<div class="due '+t._d.cls+'">'+esc(t._d.lab)+'</div>':'')+'</div>'; }); });
  if(done.length && shown<MAX){ h+='<div class="tdsec">Done today</div>'; done.slice(0,MAX-shown).forEach(function(t){ shown++; h+='<div class="td done" tabindex="0" data-id="'+esc(t.id)+'"><div class="bx">✓</div><div class="tt">'+esc(t.title)+'</div></div>'; }); }
  var more=open.length+done.length-shown;
  if(!open.length && !done.length) h='<div class="empty"><div class="big">✓</div><div class="t1">All clear</div><div class="t2">Nothing on your Homebase list.</div></div>';
  var nT=open.filter(function(t){return t._d.sec==="today"||t._d.sec==="over";}).length;
  el.innerHTML='<div class="tdhead"><div class="ph">'+(open.length?(nT?nT+" to do today":"Nothing due today"):"To-do")+'</div><div class="tdcount">'+open.length+' open · '+done.length+' done today'+(FEED_ERR?' · offline':'')+'</div></div>'+
    '<div class="tdlist">'+h+(more>0?'<div class="tdmore">+ '+more+' more in Homebase</div>':'')+'</div><div class="hint">Remote: ▲▼ select · OK check off · ◀ ▶ switch panels</div>';
  if(focusId){ var f=el.querySelector('.td[data-id="'+focusId+'"]'); if(f) f.focus(); }
}
function toggleTodo(id){
  if(!FEED) return; var t=(FEED.todos||[]).filter(function(x){return String(x.id)===id;})[0]; if(!t) return;
  t.done=!t.done; t.done_at=t.done?new Date().toISOString():null; buildTodo();
  if(!FEED_URL) return;
  fetch(feedUrl(),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"set_done",id:t.id,done:t.done})})
    .then(function(r){ if(!r.ok) throw 0; setTimeout(loadFeed,1500); }).catch(function(){ t.done=!t.done; buildTodo(); });
}

/* ---------- remote control ---------- */
document.addEventListener("keydown",function(e){
  var k=e.keyCode; paused=Date.now()+90000;
  if(k===39){ show(cur+1); e.preventDefault(); return; }
  if(k===37){ show(cur-1); e.preventDefault(); return; }
  var onT=PANELS[cur]&&PANELS[cur].id==="todo";
  if(!onT && (k===38||k===40||k===13||k===23)){ show(PANELS.map(function(p){return p.id;}).indexOf("todo")); setTimeout(function(){ var f=document.querySelector(".td"); if(f) f.focus(); },60); e.preventDefault(); return; }
  if(onT){
    var list=[].slice.call(document.querySelectorAll(".td")), at=list.indexOf(document.activeElement);
    if(k===40){ (list[Math.min(list.length-1,at+1)]||list[0])&&(list[Math.min(list.length-1,at+1)]||list[0]).focus(); e.preventDefault(); }
    if(k===38){ (list[Math.max(0,at-1)]||list[0])&&(list[Math.max(0,at-1)]||list[0]).focus(); e.preventDefault(); }
    if((k===13||k===23)&&at>=0){ toggleTodo(list[at].getAttribute("data-id")); e.preventDefault(); }
  }
});

/* ---------- burn-in protection: drift the whole layout a few px ---------- */
function shift(){ $("app").style.transform="translate("+(Math.random()*16-8).toFixed(1)+"px,"+(Math.random()*12-6).toFixed(1)+"px)"; }

/* ---------- auto-update: reload when a newer version is published ---------- */
var VERSION="2026-11-09-h";
function checkUpdate(){
  fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();})
    .then(function(t){ var m=t.match(/var VERSION="([^"]+)"/); if(m && m[1]!==VERSION) location.reload(true); }).catch(function(){});
}
setInterval(checkUpdate,5*60000);
